schema_version = "1.4"
# Harbor task config: a manual profile-patch insert of a bundle-provided plugin id
# causes a fatal boot crash (task S22, static, read-only)
[task]
name = "dsh-plugin-upgrade/s22-duplicate-insert-boot-crash-trap"
version = "1.1.0"
description = "After a dsh upgrade, a maintainer manually inserts workspace-files into the profile's cordis.patch.yml to fix an unavailable sidebar tab — but the web-app bundle already provides it, causing a fatal 'duplicate loader entry id' boot crash: the agent must diagnose the Cordis insert-duplication rule, remove the profile-patch duplicate, and distinguish it from a genuine compose gap"
keywords = ["dsh", "cordis", "profile-patch", "duplicate-insert", "boot-crash", "harbor"]

[metadata]
difficulty = "easy"
category = "programming"
tags = ["dsh", "cordis", "profile-patch", "duplicate-insert", "english-prompt"]
execution_contract = "BENCHMARK-AUTH-v1"

[agent]
timeout_sec = 300.0

[verifier]
timeout_sec = 120.0

[environment]
network_mode = "public"
cpus = 1
memory_mb = 2048
storage_mb = 4096
